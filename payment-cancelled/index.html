<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - LMT Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .cancel-icon {
            width: 80px;
            height: 80px;
            background: rgba(251, 191, 36, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: #fbbf24;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .note {
            font-size: 14px;
            color: #64748b;
            margin-top: 24px;
        }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 28px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cancel-icon">✕</div>
        <h1>Payment Cancelled</h1>
        <p>Your payment was not completed. No charges have been made to your account.</p>
        <p>If you experienced any issues or have questions, please contact your service provider.</p>

        <p class="note">You can safely close this page or use the link provided by your therapist to try again.</p>
    </div>
</body>
</html>
