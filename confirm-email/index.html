<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmed - LMT Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
        }
        h1 span {
            color: #7c3aed;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 28px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #6d28d9;
        }
        .note {
            font-size: 14px;
            color: #64748b;
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✉️</div>
        <h1>Email <span>Confirmed!</span></h1>
        <p>Your email address has been verified successfully.</p>
        <p>You can now access all features of LMT Assistant.</p>

        <a href="lmtassistant://email-confirmed" class="btn">Open App</a>

        <p class="note">If the button doesn't work, open the LMT Assistant app directly on your device.</p>
    </div>
</body>
</html>
