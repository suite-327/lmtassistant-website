<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Stripe - LMT Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(124, 58, 237, 0.2);
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
        }
        .error {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }
        .error h2 {
            color: #f87171;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .error p {
            color: #fca5a5;
        }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <h1>Connecting Your Stripe Account</h1>
            <p>Please wait while we complete the connection...</p>
        </div>
        <div id="error" class="error">
            <h2>Connection Issue</h2>
            <p id="error-message">Something went wrong. Please try again.</p>
            <a href="lmtassistant://stripe-callback?error=connection_failed" class="btn">Return to App</a>
        </div>
    </div>

    <script>
        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        // Build the app deep link with all parameters
        let appUrl = 'lmtassistant://stripe-callback';
        const appParams = new URLSearchParams();

        if (code) appParams.set('code', code);
        if (state) appParams.set('state', state);
        if (error) appParams.set('error', error);
        if (errorDescription) appParams.set('error_description', errorDescription);

        if (appParams.toString()) {
            appUrl += '?' + appParams.toString();
        }

        // Try to redirect to the app
        if (error) {
            // Show error state
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = errorDescription || error;
        } else if (code) {
            // Show success with manual option
            document.getElementById('loading').innerHTML = `
                <div style="width: 64px; height: 64px; background: rgba(34, 197, 94, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px;">✓</div>
                <h1 style="color: #22c55e;">Stripe Connected!</h1>
                <p style="margin-bottom: 24px;">Your Stripe account has been connected successfully.</p>
                <a href="${appUrl}" class="btn" style="background: #7c3aed; color: white; padding: 14px 28px; border-radius: 10px; text-decoration: none; display: inline-block; margin-bottom: 16px;">Open LMT Assistant</a>
                <p style="font-size: 14px; color: #64748b;">If the button doesn't work, return to the app manually.<br>Your connection is saved automatically.</p>
            `;

            // Try auto-redirect after a moment
            setTimeout(() => {
                window.location.href = appUrl;
            }, 1000);
        } else {
            // No code or error - show generic message
            document.getElementById('loading').innerHTML = `
                <h1>Redirecting...</h1>
                <p>Please return to the LMT Assistant app.</p>
            `;
        }
    </script>
</body>
</html>
