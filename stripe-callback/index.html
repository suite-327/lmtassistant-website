<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Connection - LMT Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 400px;
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        .icon-success {
            background: rgba(34, 197, 94, 0.2);
        }
        .icon-error {
            background: rgba(239, 68, 68, 0.2);
        }
        .icon-loading {
            background: rgba(124, 58, 237, 0.2);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(124, 58, 237, 0.3);
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        h1.success { color: #22c55e; }
        h1.error { color: #f87171; }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #6d28d9;
        }
        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="icon icon-loading">
            <div class="spinner"></div>
        </div>
        <h1>Connecting...</h1>
        <p>Please wait while we complete your Stripe connection.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const message = params.get('message');
        const content = document.getElementById('content');

        if (status === 'success') {
            content.innerHTML = `
                <div class="icon icon-success">✓</div>
                <h1 class="success">Stripe Connected!</h1>
                <p>Your Stripe account has been connected successfully. You can now accept payments through the app.</p>
                <a href="lmtassistant://stripe-callback?status=success" class="btn">Return to App</a>
                <p class="hint">If the button doesn't work, simply return to the LMT Assistant app manually.</p>
            `;
        } else if (status === 'error') {
            content.innerHTML = `
                <div class="icon icon-error">✕</div>
                <h1 class="error">Connection Failed</h1>
                <p>${message || 'Something went wrong while connecting your Stripe account. Please try again.'}</p>
                <a href="lmtassistant://settings" class="btn">Return to App</a>
                <p class="hint">If the button doesn't work, return to the app and try connecting again.</p>
            `;
        } else {
            // No status - just show a generic return message
            content.innerHTML = `
                <div class="icon icon-loading">
                    <div class="spinner"></div>
                </div>
                <h1>Processing...</h1>
                <p>Please wait or return to the LMT Assistant app.</p>
            `;
        }
    </script>
</body>
</html>
